version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: secure-drop-app
    container_name: secure-drop-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: secure_drop
      DB_USERNAME: secure_user
      DB_PASSWORD: secure_password
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - secure-drop-network

  web:
    image: nginx:alpine
    container_name: secure-drop-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - secure-drop-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: secure-drop-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: secure_drop
      MYSQL_USER: secure_user
      MYSQL_PASSWORD: secure_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - secure-drop-network

networks:
  secure-drop-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
