services:
  - type: web
    name: secure-drop-api
    env: docker
    plan: free
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
    databases:
      - name: secure-drop-db
        plan: free

databases:
  - name: secure-drop-db
    plan: free
    ipAllowList: []
